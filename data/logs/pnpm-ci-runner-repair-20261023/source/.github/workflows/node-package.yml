name: node-package
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Explicit JSON runner labels supplied by the caller'
        type: string
        required: true
      paths:
        description: 'JSON array of package directories; empty = every package.json in the repo'
        type: string
        default: ''
      concurrency:
        type: number
        default: 4
      install:
        description: 'Install dependencies; set false only for dependency-free source tests'
        type: boolean
        default: true
      check:
        description: 'Run the package check script'
        type: boolean
        default: true
      test-script:
        description: 'npm script to run for tests (default remains test)'
        type: string
        default: 'test'
      test-arguments:
        description: 'Source-owned JSON argument vector appended to the named test script'
        type: string
        default: '[]'
      node-test:
        description: 'Optional source-owned native Node test descriptor: expectedScript, files, concurrency'
        type: string
        default: ''
      package-manager:
        description: 'npm preserves existing callers; pnpm requires a source-owned exact version'
        type: string
        default: 'npm'
      pnpm-version:
        description: 'Exact stable source-owned PNPM pin; optional only when packageManager supplies the same pin'
        type: string
        default: ''
      supplier-ref:
        description: 'Exact CD source commit for the PNPM install implementation'
        type: string
        default: ''
      source-commit:
        description: 'Exact reviewed source commit; required for PNPM receiving'
        type: string
        default: ''
      registry-url:
        description: 'Explicit HTTPS registry origin/path for optional read authentication'
        type: string
        default: ''
      registry-username:
        description: 'Named registry account when password authentication is used'
        type: string
        default: ''
    secrets:
      registry-token:
        description: 'Optional read credential, confined to installation'
        required: false
      registry-password:
        description: 'Optional named account password, confined to installation'
        required: false
jobs:
  discover:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      dirs: ${{ steps.d.outputs.dirs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false
      - id: d
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then dirs="$PATHS"; else
            dirs=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -print0 \
              | xargs -0 -r -n1 dirname | sort | jq -R . | jq -sc .)
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
  package:
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.concurrency }}
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Validate package manager and source supplier
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          SUPPLIER_REF: ${{ inputs.supplier-ref }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) ;;
            pnpm)
              [[ "$SUPPLIER_REF" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Exact CD supplier-ref required'; exit 1; }
              [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Exact reviewed source-commit required'; exit 1; }
              test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" || { echo '::error::Source checkout differs'; exit 1; }
              ;;
            *) echo '::error::Unsupported package manager'; exit 1 ;;
          esac
      - name: Receive exact PNPM installer source
        if: inputs.install && inputs.package-manager == 'pnpm'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: red-cup-engineering/continuous-delivery-services-section
          ref: ${{ inputs.supplier-ref }}
          path: .ci-supplier
          persist-credentials: false
      - name: Install original frozen PNPM graph
        if: inputs.install && inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_USERNAME: ${{ inputs.registry-username }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
        run: node "$GITHUB_WORKSPACE/.ci-supplier/scripts/node-package-install.mjs"
      - name: Install dependencies when needed
        if: inputs.install && inputs.package-manager == 'npm'
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Check package when requested
        if: inputs.check
        env:
          NODE_OPTIONS: ${{ inputs.package-manager == 'pnpm' && '--max-old-space-size=512' || '' }}
        run: npm run --if-present check
      - name: Run selected named test script
        env:
          NODE_OPTIONS: ${{ inputs.package-manager == 'pnpm' && '--max-old-space-size=512' || '' }}
          TEST_SCRIPT: ${{ inputs.test-script }}
          TEST_ARGUMENTS: ${{ inputs.test-arguments }}
          NODE_TEST: ${{ inputs.node-test }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const script=process.env.TEST_SCRIPT??'';
          if(!/^[a-zA-Z0-9:._-]+$/.test(script))throw new TypeError('Invalid npm test script name');
          const encoded=process.env.TEST_ARGUMENTS??'[]';
          if(Buffer.byteLength(encoded)>16384)throw new TypeError('bounded named test arguments required');
          const args=JSON.parse(encoded);
          if(!Array.isArray(args)||args.length>32||args.some(value=>typeof value!=='string'||value.length>4096||/[\r\n\0]/.test(value)))
            throw new TypeError('bounded literal named test arguments required');
          let executable='npm',argv=['run','--if-present',script,...(args.length?['--',...args]:[])];
          const native=process.env.NODE_TEST??'';
          if(native){
            if(Buffer.byteLength(native)>16384||args.length)throw new TypeError('one bounded native test descriptor required');
            const descriptor=JSON.parse(native);
            if(!descriptor||Array.isArray(descriptor)||Object.keys(descriptor).sort().join(',')!=='concurrency,expectedScript,files'
                ||!Array.isArray(descriptor.files)||!descriptor.files.length||descriptor.files.length>32
                ||descriptor.files.some(file=>typeof file!=='string'||file.length>1024||! /^[A-Za-z0-9_./*?-]+$/.test(file)
                  ||file.startsWith('/')||file.startsWith('-')||file.split('/').includes('..'))
                ||!Number.isInteger(descriptor.concurrency)||descriptor.concurrency<1||descriptor.concurrency>16)
              throw new TypeError('bounded native Node test descriptor required');
            const canonical='node --test '+descriptor.files.map(file=>JSON.stringify(file)).join(' ');
            const manifest=JSON.parse(readFileSync('package.json','utf8'));
            if(descriptor.expectedScript!==canonical||manifest.scripts?.[script]!==canonical
                ||Object.hasOwn(manifest.scripts,'pre'+script)||Object.hasOwn(manifest.scripts,'post'+script))
              throw new TypeError('native test descriptor differs from original script or lifecycle hooks');
            executable=process.execPath;argv=['--test','--test-concurrency='+descriptor.concurrency,...descriptor.files];
          }
          const result=spawnSync(executable,argv,{stdio:'inherit',shell:false});
          if(result.error)throw new Error('named package test could not start');
          process.exit(result.status??1);
          NODE
