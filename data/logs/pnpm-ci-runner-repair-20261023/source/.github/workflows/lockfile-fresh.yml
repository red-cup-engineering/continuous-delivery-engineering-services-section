name: lockfile-fresh
# Read the pull request's manifests and lock with the same checker and native
# source tree selected by the admitted composed workspace.
on:
  workflow_call:
    inputs:
      supplier-revision:
        description: 'Exact generator revision that supplies this reusable workflow and its executing source'
        type: string
        required: true
      tool-workspace-repository:
        description: 'Repository containing the committed recursive source workspace and full native lock'
        type: string
        required: true
      tool-workspace-revision:
        description: 'Exact composed workspace commit, separate from the pull request source under inspection'
        type: string
        required: true
      tool-workspace-checker-path:
        description: 'Workspace-relative Gitlink path to the selected lockfile checker source'
        type: string
        required: true
      directory:
        description: 'Workspace root inside the repository'
        type: string
        default: '.'
      runs-on:
        description: 'JSON runner labels, for repositories without GitHub-hosted runners (e.g. ["self-hosted","Linux","X64","bare-cedar-fog"])'
        type: string
        required: true
    secrets:
      source-read-token:
        description: 'Existing read credential for the composed workspace and every recursively selected private source repository'
        required: true
jobs:
  lockfile-fresh:
    concurrency:
      group: lockfile-fresh-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.gitmodules
            **/.gitmodules
            **/package.json
            **/pnpm-lock.yaml
            **/pnpm-workspace.yaml
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.gitmodules
            **/.gitmodules
            **/package.json
            **/pnpm-lock.yaml
            **/pnpm-workspace.yaml
      - name: Admit exact source bindings
        env:
          SUPPLIER_REVISION: ${{ inputs.supplier-revision }}
          TOOL_WORKSPACE_REPOSITORY: ${{ inputs.tool-workspace-repository }}
          TOOL_WORKSPACE_REVISION: ${{ inputs.tool-workspace-revision }}
          TOOL_WORKSPACE_CHECKER_PATH: ${{ inputs.tool-workspace-checker-path }}
        run: |
          [[ "$SUPPLIER_REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo 'supplier revision must be an exact source commit' >&2; exit 1; }
          [[ "$TOOL_WORKSPACE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'tool workspace repository must be owner/name' >&2; exit 1; }
          [[ "$TOOL_WORKSPACE_REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo 'tool workspace revision must be an exact source commit' >&2; exit 1; }
          [[ -n "$TOOL_WORKSPACE_CHECKER_PATH" && "$TOOL_WORKSPACE_CHECKER_PATH" != /* && "$TOOL_WORKSPACE_CHECKER_PATH" != *\\* ]] || { echo 'canonical workspace-relative checker path required' >&2; exit 1; }
          node -e 'const p=process.env.TOOL_WORKSPACE_CHECKER_PATH.split("/");if(p.some(x=>!x||x==="."||x===".."))throw Error("canonical workspace-relative checker path required")'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.tool-workspace-repository }}
          ref: ${{ inputs.tool-workspace-revision }}
          path: tool-workspace
          token: ${{ secrets.source-read-token }}
          persist-credentials: false
          submodules: false
          filter: blob:none
          fetch-depth: 1
      - name: Receive only the selected checker Gitlinks
        shell: bash
        env:
          TOOL_WORKSPACE_REVISION: ${{ inputs.tool-workspace-revision }}
          TOOL_WORKSPACE_CHECKER_PATH: ${{ inputs.tool-workspace-checker-path }}
          SUPPLIER_REVISION: ${{ inputs.supplier-revision }}
          SOURCE_READ_TOKEN: ${{ secrets.source-read-token }}
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE/tool-workspace"
          test "$(git -C "$workspace" rev-parse HEAD)" = "$TOOL_WORKSPACE_REVISION"
          test -n "$SOURCE_READ_TOKEN"
          export GH_TOKEN="$SOURCE_READ_TOKEN"
          root="$workspace"
          remaining="$TOOL_WORKSPACE_CHECKER_PATH"
          depth=0
          while [ -n "$remaining" ]; do
            selected=''
            prefix=''
            tail="$remaining"
            while [ -n "$tail" ]; do
              part="${tail%%/*}"
              if [ "$tail" = "$part" ]; then tail=''; else tail="${tail#*/}"; fi
              prefix="${prefix:+$prefix/}$part"
              entry="$(git -C "$root" ls-tree HEAD -- "$prefix")"
              if [ "${entry%% *}" = 160000 ]; then selected="$prefix"; break; fi
            done
            if [ -z "$selected" ]; then echo 'checker source is not reached by selected Gitlinks' >&2; exit 1; fi
            expected="$(printf '%s\n' "$entry" | awk '{print $3}')"
            [[ "$expected" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git -C "$root" -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              submodule update --init --checkout --depth=1 -- "$selected"
            root="$root/$selected"
            test "$(git -C "$root" rev-parse HEAD)" = "$expected"
            depth=$((depth+1))
            if [ "$depth" -gt 8 ]; then echo 'nested source depth exceeded' >&2; exit 1; fi
            if [ "$remaining" = "$selected" ]; then remaining=''; else remaining="${remaining#"$selected"/}"; fi
          done
          test "$(realpath "$root")" = "$(realpath "$workspace/$TOOL_WORKSPACE_CHECKER_PATH")"
          test "$(git -C "$root" rev-parse HEAD)" = "$SUPPLIER_REVISION"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the exact committed checker
        shell: bash
        env:
          TOOL_WORKSPACE_CHECKER_PATH: ${{ inputs.tool-workspace-checker-path }}
          SUPPLIER_REVISION: ${{ inputs.supplier-revision }}
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE/tool-workspace"
          checker="$workspace/$TOOL_WORKSPACE_CHECKER_PATH"
          test "$(git -C "$checker" rev-parse HEAD)" = "$SUPPLIER_REVISION"
          test -s "$checker/package-lock.json"
          cd "$checker"
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Lockfile freshness
        env:
          DIRECTORY: ${{ inputs.directory }}
          TOOL_WORKSPACE_CHECKER_PATH: ${{ inputs.tool-workspace-checker-path }}
          GH_TOKEN: ${{ secrets.source-read-token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          workspace="$GITHUB_WORKSPACE/tool-workspace"
          checker="$workspace/$TOOL_WORKSPACE_CHECKER_PATH"
          head_directory="$GITHUB_WORKSPACE/head/$DIRECTORY"
          base_args=()
          if [ -d "$GITHUB_WORKSPACE/base" ]; then base_args=(--base "$GITHUB_WORKSPACE/base/$DIRECTORY"); fi
          export FRESHNESS_FILE="$RUNNER_TEMP/lockfile-freshness.json"
          checker=$(realpath "$checker")
          checker_root=$(realpath "$(git -C "$checker" rev-parse --show-toplevel)")
          [[ "$checker_root" == "$checker" ]] || { echo 'checker path must identify the selected Gitlink root' >&2; exit 1; }
          status=0
          (cd "$checker" && node scripts/lockfile-fresh.mjs "$head_directory" "${base_args[@]}") > "$FRESHNESS_FILE" || status=$?
          if [[ ! -s "$FRESHNESS_FILE" ]]; then
            echo 'native lockfile checker produced no freshness result' >&2
            if (( status != 0 )); then exit "$status"; fi
            exit 1
          fi
          node -e '
            const r=require(process.env.FRESHNESS_FILE);
            const lines=[`### Lockfile freshness: ${r.added.length?"`stale`":"`fresh`"} (${r.mismatches} known mismatches)`,""];
            for(const m of r.added)lines.push(`- added: \`${m.key}\``+(m.declared!==undefined?` (declared ${m.declared}, locked ${m.locked})`:""));
            if(r.removed.length)lines.push(`- removed: ${r.removed.length}`);
            if(r.unreadSubmodules?.length)lines.push(`- unread (mount not reachable from this runner): ${r.unreadSubmodules.map(p=>`\`${p}\``).join(", ")}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");'
          cat "$FRESHNESS_FILE"
          exit $status
