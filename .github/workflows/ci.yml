name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Full private-composition receiving is preserved in the original reusable
  # node-package.yml, but cannot be an automatic prerequisite for this PUBLIC
  # source check while the old Bare Cedar Fog runner is not an independent
  # available executor. An authorized consumer must select an observed runner.
  agent-work-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Source-only tests in this public repository use an isolated standard
    # hosted runner. Machine/regression receiving remains with the real consumers.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install pinned generator parser
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check standalone public source contracts
        run: |
          npm run test:public-source-contract
