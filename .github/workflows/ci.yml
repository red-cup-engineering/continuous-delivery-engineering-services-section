name: ci
on: [push, pull_request]
jobs:
  node-package:
    uses: ./.github/workflows/node-package.yml
    with:
      runs-on: '["ubuntu-latest"]'
  agent-work-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install pinned generator parser
        run: npm ci --no-audit --no-fund
      - name: Check maintained intake and generated caller contracts
        run: |
          node --check src/agent-work.mjs
          node --check generator/generate-ci.mjs
          node --test test/agent-work.test.mjs test/generate-ci.test.mjs
