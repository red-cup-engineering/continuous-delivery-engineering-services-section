name: submodule-advance
on:
  workflow_call:
    inputs:
      branch:
        description: 'PR branch name'
        type: string
        default: ci/submodule-advance
      note:
        description: 'line placed first in the pull request body (the upward chain names the section that moved)'
        type: string
        default: ''
      runs-on:
        description: 'JSON runner labels supplied by the hiring repository'
        type: string
        required: true
    secrets:
      token:
        description: 'PAT able to read submodule remotes and push/open PRs in the caller (falls back to GITHUB_TOKEN)'
        required: false
permissions:
  contents: write
  pull-requests: write
jobs:
  advance:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
      BRANCH: ${{ inputs.branch }}
      NOTE: ${{ inputs.note }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          token: ${{ secrets.token || github.token }}
          submodules: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: red-cup-engineering/continuous-delivery-services-section
          ref: 131900a1a55b8d3d769a389c43cd6236147d69ab
          path: .cds
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: keep the engine checkout out of the tree
        run: echo "/.cds" >> .git/info/exclude
      - name: advance gitlinks where the remote head moved
        id: advance
        run: node .cds/scripts/advance.mjs --branch "$BRANCH" --note "$NOTE"
      - name: open or update the one pull request
        if: always() && steps.advance.outputs.advanced == 'true'
        run: |
          set -eu
          # Use the maintained REST surface; older gh pr edit queries removed
          # projectCards even when only the body is being changed. A failed
          # lookup must stop here, never be interpreted as permission to create.
          n=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f "head=${GITHUB_REPOSITORY%%/*}:$BRANCH" -f "base=$BASE" \
            -f state=open -f per_page=2 \
            --jq 'if length > 1 then error("ambiguous sync pull request") else .[0].number // empty end')
          if [ -n "$n" ]; then
            case "$n" in *[!0-9]*|0) echo 'Invalid pull request number' >&2; exit 1 ;; esac
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$n" \
              -F body=@.git/advance-body.md --jq .html_url
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f "base=$BASE" -f "head=$BRANCH" -f 'title=Advance submodules' \
              -F body=@.git/advance-body.md --jq .html_url
          fi
