name: Agent work intake
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON runner labels; a repository with a house runner names it (e.g. ["self-hosted","Linux","X64","bare-cedar-fog"])'
        type: string
        required: true
permissions:
  contents: read
jobs:
  receive:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # Every intake run of one branch or pull request is the same question; the newest answers it.
    concurrency:
      group: agent-work-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Receive the maintained intake implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/continuous-delivery-services-section
          ref: c79c67ad02c83f2230f180e0fab4822976455856
          sparse-checkout: src/agent-work.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Receive branch and pull metadata
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const {receiveAgentWork}=await import(`${process.env.GITHUB_WORKSPACE}/src/agent-work.mjs`);
            await receiveAgentWork({github,context,core});
