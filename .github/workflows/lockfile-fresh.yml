name: lockfile-fresh
# Is the pnpm lock fresh? Every workspace package must have an importer whose specifiers are exactly its declared
# dependencies (overrides applied), and every workspace:* dependency must name a workspace package. Run as a
# ratchet: the pull request's base is read too, and only mismatches the pull request adds fail. A mounted
# submodule is read at the commit the superproject records (its .gitmodules URL, fetched blobless with the
# runner's own git access); a mount the runner cannot reach is listed as unread, never judged.
on:
  workflow_call:
    inputs:
      directory:
        description: 'Workspace root inside the repository'
        type: string
        default: '.'
      runs-on:
        description: 'JSON runner labels, for repositories without GitHub-hosted runners (e.g. ["self-hosted","Linux","X64","bare-cedar-fog"])'
        type: string
        default: '"ubuntu-latest"'
jobs:
  lockfile-fresh:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.gitmodules
            **/package.json
            **/pnpm-lock.yaml
            **/pnpm-workspace.yaml
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.gitmodules
            **/package.json
            **/pnpm-lock.yaml
            **/pnpm-workspace.yaml
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: red-cup-engineering/continuous-delivery-services-section
          path: section
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          # No package-manager cache: the reading needs only the section's own npm install, and setup-node's
          # automatic pnpm detection fails on runners without pnpm (the bare-cedar-fog runner has none).
          package-manager-cache: false
      - name: Lockfile freshness
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: |
          (cd section && npm install --no-audit --no-fund --silent)
          base_args=()
          if [ -d base ]; then base_args=(--base "base/$DIRECTORY"); fi
          status=0
          node section/scripts/lockfile-fresh.mjs "head/$DIRECTORY" "${base_args[@]}" > freshness.json || status=$?
          node -e '
            const r=require("./freshness.json");
            const lines=[`### Lockfile freshness: ${r.added.length?"`stale`":"`fresh`"} (${r.mismatches} known mismatches)`,""];
            for(const m of r.added)lines.push(`- added: \`${m.key}\``+(m.declared!==undefined?` (declared ${m.declared}, locked ${m.locked})`:""));
            if(r.removed.length)lines.push(`- removed: ${r.removed.length}`);
            if(r.unreadSubmodules?.length)lines.push(`- unread (mount not reachable from this runner): ${r.unreadSubmodules.map(p=>`\`${p}\``).join(", ")}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");'
          cat freshness.json
          exit $status
