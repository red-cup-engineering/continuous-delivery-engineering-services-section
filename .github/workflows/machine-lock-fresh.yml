name: machine-lock-fresh
# Does a machine snapshot's dependencies.lock.yaml still satisfy the workspace its pinned controller composes?
# Resolved the way a release resolves (scripts/machine-lock-fresh.mjs): pinned sources, the pinned controller's
# prepare-sources --manifests-only, pnpm 11.9.0 frozen and lockfile-only. Run as a ratchet against the pull
# request's base, so a main that is already stale does not block unrelated pull requests.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON runner labels (the machine build runner, which can read every pinned source)'
        type: string
        default: '"ubuntu-latest"'
jobs:
  machine-lock-fresh:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sources.json
            /dependencies.lock.yaml
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sources.json
            /dependencies.lock.yaml
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: red-cup-engineering/continuous-delivery-services-section
          path: section
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Machine lock freshness
        run: |
          base_args=()
          if [ -d base ]; then base_args=(--base base); fi
          status=0
          node section/scripts/machine-lock-fresh.mjs head "$RUNNER_TEMP/machine-lock-fresh" "${base_args[@]}" > freshness.json || status=$?
          node -e '
            const r=require("./freshness.json");
            const lines=[`### Machine lock: \`${r.verdict}\`${r.fails?" (fails)":""}`,"",`controller \`${r.head.controller??"unresolved"}\``];
            if(r.head.reason)lines.push("","```",r.head.reason.slice(0,1500),"```");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");'
          cat freshness.json
          rm -rf "$RUNNER_TEMP/machine-lock-fresh"
          exit $status
