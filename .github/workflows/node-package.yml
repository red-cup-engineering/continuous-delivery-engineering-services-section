name: node-package
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Explicit JSON runner labels supplied by the caller'
        type: string
        required: true
      paths:
        description: 'JSON array of package directories; empty = every package.json in the repo'
        type: string
        default: ''
      concurrency:
        type: number
        default: 4
      install:
        description: 'Install dependencies; set false only for dependency-free source tests'
        type: boolean
        default: true
      check:
        description: 'Run the package check script'
        type: boolean
        default: true
      test-script:
        description: 'npm script to run for tests (default remains test)'
        type: string
        default: 'test'
      package-manager:
        description: 'npm preserves existing callers; pnpm requires a source-owned exact version'
        type: string
        default: 'npm'
      pnpm-version:
        description: 'Exact stable source-owned PNPM pin; optional only when packageManager supplies the same pin'
        type: string
        default: ''
      supplier-ref:
        description: 'Exact CD source commit for the PNPM install implementation'
        type: string
        default: ''
      source-commit:
        description: 'Exact reviewed source commit; required for PNPM receiving'
        type: string
        default: ''
      registry-url:
        description: 'Explicit HTTPS registry origin/path for optional read authentication'
        type: string
        default: ''
      registry-username:
        description: 'Named registry account when password authentication is used'
        type: string
        default: ''
    secrets:
      registry-token:
        description: 'Optional read credential, confined to installation'
        required: false
      registry-password:
        description: 'Optional named account password, confined to installation'
        required: false
jobs:
  discover:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      dirs: ${{ steps.d.outputs.dirs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false
      - id: d
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then dirs="$PATHS"; else
            dirs=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -print0 \
              | xargs -0 -r -n1 dirname | sort | jq -R . | jq -sc .)
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
  package:
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.concurrency }}
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Validate package manager and source supplier
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          SUPPLIER_REF: ${{ inputs.supplier-ref }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) ;;
            pnpm)
              [[ "$SUPPLIER_REF" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Exact CD supplier-ref required'; exit 1; }
              [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Exact reviewed source-commit required'; exit 1; }
              test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" || { echo '::error::Source checkout differs'; exit 1; }
              ;;
            *) echo '::error::Unsupported package manager'; exit 1 ;;
          esac
      - name: Receive exact PNPM installer source
        if: inputs.install && inputs.package-manager == 'pnpm'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: red-cup-engineering/continuous-delivery-services-section
          ref: ${{ inputs.supplier-ref }}
          path: .ci-supplier
          persist-credentials: false
      - name: Install original frozen PNPM graph
        if: inputs.install && inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          REGISTRY_USERNAME: ${{ inputs.registry-username }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
        run: node "$GITHUB_WORKSPACE/.ci-supplier/scripts/node-package-install.mjs"
      - name: Install dependencies when needed
        if: inputs.install && inputs.package-manager == 'npm'
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Check package when requested
        if: inputs.check
        env:
          NODE_OPTIONS: ${{ inputs.package-manager == 'pnpm' && '--max-old-space-size=512' || '' }}
        run: npm run --if-present check
      - name: Run selected named test script
        env:
          NODE_OPTIONS: ${{ inputs.package-manager == 'pnpm' && '--max-old-space-size=512' || '' }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          case "$TEST_SCRIPT" in
            ''|*[!a-zA-Z0-9:._-]*) echo "::error::Invalid npm test script name"; exit 1 ;;
          esac
          npm run --if-present "$TEST_SCRIPT"
