name: node-package
on:
  workflow_call:
    inputs:
      paths:
        description: 'JSON array of package directories; empty = every package.json in the repo'
        type: string
        default: ''
      concurrency:
        type: number
        default: 4
      install:
        description: 'Install dependencies; set false only for dependency-free source tests'
        type: boolean
        default: true
      check:
        description: 'Run the package check script'
        type: boolean
        default: true
      test-script:
        description: 'npm script to run for tests (default remains test)'
        type: string
        default: 'test'
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.d.outputs.dirs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: d
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -n "$PATHS" ]; then dirs="$PATHS"; else
            dirs=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -print0 \
              | xargs -0 -r -n1 dirname | sort | jq -R . | jq -sc .)
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
  package:
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.concurrency }}
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install dependencies when needed
        if: inputs.install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Check package when requested
        if: inputs.check
        run: npm run --if-present check
      - name: Run selected named test script
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          case "$TEST_SCRIPT" in
            ''|*[!a-zA-Z0-9:._-]*) echo "::error::Invalid npm test script name"; exit 1 ;;
          esac
          npm run --if-present "$TEST_SCRIPT"
